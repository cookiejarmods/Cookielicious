buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath group: "org.spongepowered", name: "mixingradle", version: "0.7-SNAPSHOT"
    }
}
plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'idea'
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: "org.spongepowered.mixin"

version = "${mc_version}-${mod_version}"
group = 'com.evoslab.cookielicious'
archivesBaseName = 'cookielicious'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: 'official', version: "${mc_version}"
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                cookielicious {
                    source sourceSets.main
                }
            }
        }

        client {
            property "mixin.debug.export", "true"
            property 'mixin.env.disableRefMap', 'true'

            //arg "-mixin.config=cookielicious.mixins.json"
        }

        server {
            property "mixin.debug.export", "true"
            property 'mixin.env.disableRefMap', 'true'

            //arg "-mixin.config=cookielicious.mixins.json"
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'cookielicious'
        }

        data {
            args '--mod', 'cookielicious', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Repos for mods to include during development
    maven {
        name 'CurseMaven'
        url 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    implementation fg.deobf("curse.maven:blueprint-382216:${blueprint_id}")
    implementation fg.deobf("curse.maven:neapolitan-382016:${neapolitan_id}")
    runtimeOnly fg.deobf("curse.maven:jei-238222:${jei_id}")

    runtimeOnly fg.deobf("curse.maven:abnormals-delight-442719:6057626")
    runtimeOnly fg.deobf("curse.maven:farmers-delight-398521:6154802")
    runtimeOnly fg.deobf("curse.maven:environmental-388992:6060255")
    runtimeOnly fg.deobf("curse.maven:upgrade-aquatic-326895:5615651")
    runtimeOnly fg.deobf("curse.maven:autumnity-365045:6151402")
    runtimeOnly fg.deobf("curse.maven:atmospheric-362393:6057624")
    runtimeOnly fg.deobf("curse.maven:seasonals-416471:6058164")
    runtimeOnly fg.deobf("curse.maven:peculiars-418551:6058169")
    runtimeOnly fg.deobf("curse.maven:gallery-1173553:6133771")

	//annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "Cookielicious",
            "Specification-Vendor": "Evo's Lab",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "Evo's Lab",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}